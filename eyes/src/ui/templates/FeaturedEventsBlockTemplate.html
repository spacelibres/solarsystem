<div class="featured-events-block">
	<span class="color {{colorClass}} small semi title-underline">Featured Events</span>
	<span class="featured-events-underline color gray dark"></span>
	<span class="featured-events-related-list">
		<ul key="featuredEventsList" id="featured-events-list" class="featured-events-list"> </ul>
	</span>
	<span class="more-toggle {{hideMoreMessage}}" onclick="toggleMore">
		<span class="x-small more-message">
			{{moreMessage}}
		</span>
		<span class="button clickable icon more-icon {{moreIcon}}"></span>
	</span>
</div>
