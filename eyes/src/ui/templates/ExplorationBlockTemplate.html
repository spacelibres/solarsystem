<div class="exploration-block">
	<span class="exploration-title color {{colorClass}} small semi title-underline">Exploration</span>
	<span class="exploration-related-list">
		<ul key="explorationList" id="exploration-list" class="exploration-list"> </ul>
	</span>
	<span class="more-toggle {{hideMoreMessage}}" onclick="toggleMore">
		<span class="x-small more-message {{hideMoreMessage}}">
			{{moreMessage}}
		</span>
		<span class="button clickable icon more-icon {{moreIcon}} {{hideMoreMessage}}"></span>
	</span>
</div>
