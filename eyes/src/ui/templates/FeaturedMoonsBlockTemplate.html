<div class="content-block panel-block no-side-padding">
	<h5 class="title {{showTitleLabel}}" style="margin: 0em 1.25em">Featured Moons</h5>
	<span>
		<ul key="featuredMoonsList"></ul>
	</span>
	<span class="more-toggle {{hideMoreMessage}}" onclick="toggleMore">
		<span class="x-small more-message {{hideMoreMessage}}">
			{{moreMessage}}
		</span>
		<span class="button clickable icon more-icon {{moreIcon}} {{hideMoreMessage}}"></span>
	</span>
</div>
